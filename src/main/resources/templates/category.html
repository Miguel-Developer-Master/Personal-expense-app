<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="/css/category.css">
    <meta charset="UTF-8">
    <title>Create a new category</title>
</head>
<body>
    <header>
        <h1 id="title">Create a new category</h1>
    </header>

    <main>
        <form id="category-form">
            <fieldset>
                <label for="category-name">Category name</label>
                <input type="text" id="category-name" name="category-name" placeholder="Food, transport, etc" required>

                <button id="finish-form">Save</button>
            </fieldset>
        </form>
    </main>
    <script type="module" src="/js/category.js"></script>
</body>
</html>
